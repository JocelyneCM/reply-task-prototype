version: '3.8'

services:
  trainer:
    build: .
    container_name: gyafc_trainer
    image: gyafc_trainer:rocm
    # Mount GPU device
    devices:
      - /dev/kfd
      - /dev/dri
    volumes:
      # Mount GYAFC dataset
      - ./GYAFC_Corpus:/data/GYAFC_Corpus:ro
      # Mount output directory
      - ./formality_model:/app/formality_model
      # Optional: mount code for development
      - ./gyafcTrainer.py:/app/gyafcTrainer.py
    environment:
      - GYAFC_PATH=/data/GYAFC_Corpus
      # ROCm device visibility
      - HSA_OVERRIDE_GFX_VERSION=gfx1201
    cap_add:
      - SYS_PTRACE
